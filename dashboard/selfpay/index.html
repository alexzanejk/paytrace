<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0f5f3f" />
    <title>Payment</title>
    <style>
      /* Shown at once, before the page's code has loaded, so there is never a blank screen. React replaces it. */
      html, body { margin: 0; background: #fff; }
      .boot-head { height: 76px; background: #0f5f3f; }
      .boot-spin { width: 34px; height: 34px; margin: 56px auto; border: 4px solid #d7ddd9; border-top-color: #0f5f3f; border-radius: 50%; animation: boot-r 0.9s linear infinite; }
      @keyframes boot-r { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spin { animation: none; } }
    </style>
  </head>
  <body>
    <!--
      The deposit page, as one file, for a website to host on its own address (made from PayTrace's own pay page).
      YOUR SERVER replaces the word __PAY_CONFIG (two underscores at each end) in the next line with JSON for each order, for example
        {"order_id":"ORD-1001","view_url":"/deposit/view","submit_url":"/deposit/submit"}
      (order_id = your own order number given to create-deposit; the two addresses are routes on YOUR server that call the
      gateway's order-view and submit-trx with your key). Write "<" as \u003c. Never put the key in this page.
    -->
    <script type="application/json" id="pay-config">__PAY_CONFIG__</script>
    <div id="root"><div class="boot-head"></div><div class="boot-spin" role="status" aria-label="Loading"></div></div>
    <script type="module" src="/src/pay/main.tsx"></script>
  </body>
</html>
