name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Each build is numbered higher than the last, so it can be installed over the previous one.
      PAYTRACE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on GitHub runners)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK at: $SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK" || true
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The missed-message recovery logic is plain Kotlin, tested here without a phone.
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Firebase wake-up pushes: the project's google-services.json (from Firebase, stored as a GitHub secret so it
      # is not committed). Without the secret the app still builds; it just cannot be woken by a push.
      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "FIREBASE=yes" >> "$GITHUB_ENV"
          else
            echo "FIREBASE=no" >> "$GITHUB_ENV"
          fi

      # One build path either way. With the permanent key (stored as GitHub secrets, never in the repo)
      # the APK can be installed over the previous one. Without it, a throwaway key is used: the build still
      # exercises exactly the same signing setup, but each build has a different signature, so Android will
      # make you uninstall the old app first.
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!v}" ]; then echo "::error::The signing key is set up but the secret $v is missing."; exit 1; fi
            done
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            KIND=permanent
          else
            PW="$(openssl rand -hex 16)"
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias throwaway -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$PW" -dname "CN=PayTrace throwaway build"
            export ANDROID_KEYSTORE_PASSWORD="$PW" ANDROID_KEY_ALIAS=throwaway ANDROID_KEY_PASSWORD="$PW"
            KIND=throwaway
          fi
          export ANDROID_KEYSTORE_PATH="$KS"
          gradle assembleRelease --no-daemon --stacktrace

          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sig.txt"
          FP="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/sig.txt" | sed 's/.*: //')"
          mkdir -p app/build/outputs/final && cp "$APK" app/build/outputs/final/paytrace.apk
          rm -f "$KS"
          # Later steps need to know whether this build carries the permanent key (only those may be published for updates).
          echo "SIGNING=$KIND" >> "$GITHUB_ENV"

          {
            echo "### PayTrace APK build $PAYTRACE_VERSION_CODE"
            echo "- Signing key: **$KIND**"
            echo "- Key fingerprint: \`$FP\`"
            if [ "$FIREBASE" = yes ]; then echo "- Firebase wake-up pushes: **included**"; else echo "- Firebase wake-up pushes: not included (no GOOGLE_SERVICES_JSON secret yet)"; fi
            if [ "$KIND" = throwaway ]; then
              echo "- ⚠️ No permanent key is set up yet, so Android will **not** install this over an older build."
              echo "  Uninstall the old app first (the phone will need approving again). See the README."
            else
              echo "- ✅ Same key as every earlier permanent build: this installs over the previous version."
              echo "  If the fingerprint ever changes, updates will stop installing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: paytrace-apk
          path: android/app/build/outputs/final/paytrace.apk
          if-no-files-found: error

      # In-app updates (optional). Only a build signed with the PERMANENT key, only from main, and only when the Cloudflare R2
      # secrets exist. The APK is uploaded first and the small latest.json last, so phones never see a version whose file is
      # not there yet. Nothing is published, and the build still passes, when any of the four secrets is missing.
      - name: Publish to the download bucket (optional)
        if: github.ref == 'refs/heads/main' && env.SIGNING == 'permanent'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "- Download bucket: not set up yet (R2 secrets missing), so this build was **not** published for in-app updates." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          # R2 does not take the newer automatic checksum headers.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          APK=android/app/build/outputs/final/paytrace.apk
          CODE="$PAYTRACE_VERSION_CODE"

          # Never go backwards: an older run that finishes late must not replace a newer latest.json.
          CURRENT="$(aws s3 cp "s3://$R2_BUCKET/latest.json" - --endpoint-url "$EP" 2>/dev/null | jq -r '.version_code // 0' 2>/dev/null || echo 0)"
          if [ "${CURRENT:-0}" -ge "$CODE" ] 2>/dev/null; then
            echo "- Download bucket: version $CURRENT is already published, so version $CODE was left out." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$APK")"
          NOTES="$(head -c 300 android/release-notes.txt 2>/dev/null | tr '\n\r' '  ' || true)"
          aws s3 cp "$APK" "s3://$R2_BUCKET/paytrace-$CODE.apk" --endpoint-url "$EP" \
            --content-type application/vnd.android.package-archive --cache-control "public, max-age=31536000, immutable" --only-show-errors
          jq -n --argjson code "$CODE" --arg apk "paytrace-$CODE.apk" --arg sha "$SHA" --argjson size "$SIZE" --arg notes "$NOTES" \
            '{version_code:$code, apk:$apk, sha256:$sha, size:$size, notes:$notes}' > latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET/latest.json" --endpoint-url "$EP" \
            --content-type application/json --cache-control "no-cache" --only-show-errors
          {
            echo "- Download bucket: **published** version 1.0.$CODE ($SIZE bytes) for in-app updates."
            echo "  Checksum: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
